name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Library tests
        run: go test -race ./...

      - name: SQLite integration tests
        run: cd driver/sqlite && go test -race ./...

      - name: Build (sqlite)
        run: cd cmd/mmmigrate && go build -tags sqlite .

      - name: Build (postgres)
        run: cd cmd/mmmigrate && go build -tags postgres .

      - name: Build (mysql)
        run: cd cmd/mmmigrate && go build -tags mysql .

      - name: Vet
        run: go vet ./...

  postgres:
    name: postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every PostgreSQL major version still supported upstream:
        # https://www.postgresql.org/support/versioning/
        postgres: ['14', '15', '16', '17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmmigrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: PostgreSQL integration tests
        run: cd driver/postgres && go test -race ./...
        env:
          MMMIGRATE_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/mmmigrate_test?sslmode=disable

  mysql:
    name: mysql ${{ matrix.mysql }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Both LTS lines plus the current innovation release (the image's
        # `innovation` tag follows it):
        # https://dev.mysql.com/doc/refman/en/mysql-releases.html
        mysql: ['8.4', '9.7', 'innovation']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mmmigrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: MySQL integration tests
        run: cd driver/mysql && go test -race ./...
        env:
          MMMIGRATE_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/mmmigrate_test?multiStatements=true
