name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Library tests
        run: go test -race ./...

      - name: SQLite integration tests
        run: cd driver/sqlite && go test -race ./...

      - name: CLI tests
        run: cd cmd/mmmigrate && go test -race -tags sqlite ./...

      - name: Build (sqlite)
        run: cd cmd/mmmigrate && go build -tags sqlite .

      - name: Build (postgres)
        run: cd cmd/mmmigrate && go build -tags postgres .

      - name: Build (mysql)
        run: cd cmd/mmmigrate && go build -tags mysql .

      - name: Build (spanner)
        run: cd cmd/mmmigrate && go build -tags spanner .

      - name: Spanner unit tests
        run: cd driver/spanner && go vet ./... && go test -race ./...

      - name: Vet
        run: go vet ./...

  postgres:
    name: postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every PostgreSQL major version still supported upstream:
        # https://www.postgresql.org/support/versioning/
        postgres: ['14', '15', '16', '17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmmigrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: PostgreSQL integration tests
        run: cd driver/postgres && go test -race ./...
        env:
          MMMIGRATE_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/mmmigrate_test?sslmode=disable

  mysql:
    name: mysql ${{ matrix.mysql }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Both LTS lines plus the current innovation release (the image's
        # `innovation` tag follows it):
        # https://dev.mysql.com/doc/refman/en/mysql-releases.html
        mysql: ['8.4', '9.7', 'innovation']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mmmigrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: MySQL integration tests
        run: cd driver/mysql && go test -race ./...
        env:
          MMMIGRATE_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/mmmigrate_test?multiStatements=true

  spanner:
    name: spanner (emulator)
    runs-on: ubuntu-latest

    services:
      # The Spanner emulator with PGAdapter in front of it: PostgreSQL wire
      # protocol on 5432, the emulator's gRPC on 9010. PGAdapter creates a
      # database the first time one is named.
      spanner:
        image: gcr.io/cloud-spanner-pg-adapter/pgadapter-emulator
        ports:
          - 5432:5432
          - 9010:9010

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Spanner integration tests (pgx through PGAdapter)
        run: cd driver/spanner && go test -race -skip TestCorpus ./...
        env:
          MMMIGRATE_TEST_SPANNER_URL: postgres://x@localhost:5432/mmmigrate_test?sslmode=disable

      # The splitter, recovery rewrites and conflict check against the
      # migrations in driver/spanner/testdata/corpus, resuming after a
      # simulated crash at every DDL statement (a few minutes).
      - name: Spanner corpus (every crash point)
        run: cd driver/spanner && go test -timeout 30m -run TestCorpus -v ./...
        env:
          MMMIGRATE_TEST_SPANNER_URL: postgres://x@localhost:5432/mmmigrate_corpus?sslmode=disable
          MMMIGRATE_TEST_CORPUS_FULL: "1"

      - name: Spanner integration tests (go-sql-spanner)
        run: cd driver/spanner/gosqlspannertest && go vet ./... && go test -race ./...
        env:
          MMMIGRATE_TEST_SPANNER_EMULATOR_HOST: localhost:9010
