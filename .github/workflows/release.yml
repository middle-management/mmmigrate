name: Release

on:
  # `published` fires both for a release published directly and for a draft
  # that gets published; `created` doesn't fire for drafts at all.
  release:
    types: [published]
  # Rebuild and upload the binaries for an existing release, e.g. one whose
  # build was missed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.6.1
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        driver: [sqlite, postgres, mysql]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          ext=""; if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="mmmigrate-${DRIVER}-${GOOS}-${GOARCH}${ext}"
          cd cmd/mmmigrate && go build -tags "${DRIVER}" -ldflags="-s -w -X main.version=${TAG}" -o "../../dist/${name}" .
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          DRIVER: ${{ matrix.driver }}

      - name: Upload asset
        # --clobber so a manual rebuild can replace assets already uploaded.
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
